[package]
name = "token2022-chunked16"
version = "0.1.0"
edition = "2021"
publish = false
description = "Chunked-16 Bulletproofs++ range proofs shared by the paired benchmark and the Token-2022 end-to-end tests"

# Standalone package. scripts/upstream.sh checks the patched fastcrypto out at
# ../.upstream/fastcrypto; run scripts/e2e.sh before invoking cargo directly.
[workspace]

[dependencies]
fastcrypto = { path = "../.upstream/fastcrypto/fastcrypto", features = ["solana-pedersen-bases"] }

[dev-dependencies]
rand = "0.8"
solana-zk-sdk = "=8.1.0"
curve25519-dalek = "=4.1.3"
bytemuck = "1"
t22x = { package = "spl-token-confidential-transfer-proof-extraction", version = "=0.7.0" }
t22gen = { package = "spl-token-confidential-transfer-proof-generation", version = "=0.7.0" }
t22iface = { package = "spl-token-2022-interface", version = "=4.0.0" }
t22zk = { package = "solana-zk-elgamal-proof-interface", version = "1" }
t22pod = { package = "solana-zk-sdk-pod", version = "0.1.2" }
t22addr = { package = "solana-address", version = "2" }
t22msg = { package = "solana-message", version = "4.2" }
t22sys = { package = "solana-system-interface", version = "3", features = ["bincode"] }
